# DSH bundle layer for the EvoOntology semantic layer.
#
# One row. Everything lives in this package: the store is a SQLite file opened
# in-process by the Host plugin, so there is no child process, no interpreter
# requirement, and no project checkout to point at.
#
# State location, all overridable by environment variable:
#   store.db     <DSH_HOME>/evoontology/store.db     DSH_EVOONTOLOGY_STORE
#   runs/        <DSH_HOME>/evoontology/runs/        DSH_EVOONTOLOGY_HOME
#   exports/     <DSH_HOME>/evoontology/exports/     DSH_EVOONTOLOGY_HOME
- insert:
    - id: evoontology
      name: '@noah/dsh-evoontology'
      config: {}
